model:
  name: google/flan-t5-base

data:
  batch_size: 8
  eval_batch_size: 4
  train_split_ratio: 0.8
  max_input_length: 512
  max_output_length: 128
  max_grad_norm: 1.0
  seed: 0

training:
  learning_rate: 2e-5
  weight_decay: 0.01
  num_epochs: 3
  lr_scheduler: linear_warmup

saving_logging:
  output_dir: ./t5flan-base-results
  logging_steps: 50
  save_total_limit: 3

generation:
  max_length: 128 # same as data.max_output_length
  num_beams: 4
