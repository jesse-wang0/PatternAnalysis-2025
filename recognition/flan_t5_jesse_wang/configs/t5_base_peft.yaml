model:
  name: google/flan-t5-base
  
lora:
  r: 32 # Rank of LoRA decomposition
  alpha: 32 # Scaling factor
  target_modules: ["q", "v"]
  dropout: 0.05 # Dropout inside LoRA

data:
  batch_size: 16
  eval_batch_size: 8
  train_split_ratio: 0.8
  max_input_length: 512
  max_output_length: 128
  max_grad_norm: 1.0
  seed: 0

training:
  learning_rate: 3e-3
  weight_decay: 0.01
  num_epochs: 5
  lr_scheduler: cosine_with_warmup
  warmup_steps: 500
  gradient_accumulation_steps: 2

saving_logging:
  output_dir: ./t5flan-base-lora-results
  logging_steps: 25
  save_total_limit: 3

generation:
  max_length: 128 # same as data.max_output_length
  num_beams: 4
